name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-remediation:
    if: github.event_name == 'push' && github.ref == 'refs/heads/chore/portfolio-ci-2026-11-25' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.2
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply non-breaking dependency security updates
        run: npm audit fix || true
      - name: Require a clean production dependency tree
        run: npm audit --omit=dev
      - name: Require no high or critical advisories in the full tree
        run: npm audit --audit-level=high
      - name: Verify lint, tests and production build
        run: |
          npm run lint
          npm run test
          npm run build
      - name: Commit verified dependency updates to this draft branch
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "security: update vulnerable frontend dependencies"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.22.2
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Report dependency advisories (non-blocking)
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit-all.json" || true
          npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit-production.json" || true
          node --input-type=module - "$RUNNER_TEMP/npm-audit-all.json" "$RUNNER_TEMP/npm-audit-production.json" <<'NODE'
          import { readFileSync } from "node:fs";
          for (const file of process.argv.slice(2)) {
            const report = JSON.parse(readFileSync(file, "utf8"));
            const entries = Object.entries(report.vulnerabilities ?? {});
            console.log(`\n${file}: ${entries.length} vulnerable packages`);
            for (const [name, item] of entries) {
              const via = item.via.map((entry) => typeof entry === "string" ? entry : entry.title).join("; ");
              console.log(`${item.severity.toUpperCase()} ${name} direct=${item.isDirect} range=${item.range} fix=${JSON.stringify(item.fixAvailable)} via=${via}`);
            }
          }
          NODE
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Production build
        run: npm run build
